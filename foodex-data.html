<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodEX Data | JSON & XML</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Week 6: XML + DTD. Week 9: Fetch API JSON/XML parsing. -->
  <header class="site-header">
    <a class="brand" href="home.html"><span>Food</span>EX</a>
    <nav class="main-nav"></nav>
  </header>
  <main>
    <section class="page-intro">
      <p class="eyebrow">WEEK 6 + WEEK 9</p>
      <h1>FoodEX Data Lab</h1>
      <p>JSON loads restaurant chains. XML loads the complete FoodEX menu.</p>
    </section>
    <section class="data-card">
      <div class="data-controls">
        <div><h2>Fetch demonstrations</h2><p>These controls only load data — they never add anything to the cart.</p></div>
        <div class="button-row">
          <button class="button primary" type="button" id="load-json-button">Load Restaurants (JSON)</button>
          <button class="button secondary" type="button" id="load-xml-button">Load Full Menu (XML)</button>
        </div>
      </div>
      <div id="output" class="data-output"><div class="data-placeholder"><strong>Select JSON or XML</strong><span>The result will appear here.</span></div></div>
    </section>
  </main>
  <script>
    // Week 9: Fetch JSON and display restaurant chains.
    const output = document.getElementById('output');
    document.getElementById('load-json-button').addEventListener('click', async () => {
      output.innerHTML = '<p class="menu-status">Loading restaurants...</p>';
      try {
        const response = await fetch('foodex-menu.json');
        if (!response.ok) throw new Error('Network error: ' + response.status);
        const restaurants = await response.json();
        output.innerHTML = '<div class="data-heading"><div><p class="eyebrow">JSON RESPONSE</p><h2>Restaurant chains</h2></div><span>'+restaurants.length+' restaurants</span></div><div class="restaurant-grid">'+
          restaurants.map(r => `<article class="restaurant-card"><img class="restaurant-image" src="${r.image}" alt="${r.name}"><div class="restaurant-card-body"><h3>${r.name}</h3><div class="restaurant-meta"><span>★ ${r.rating}</span><strong>${r.cuisine}</strong></div><a class="button secondary" href="restaurant-menu.html?id=${encodeURIComponent(r.id)}">Explore Menu</a></div></article>`).join('')+'</div>';
      } catch(error) { output.innerHTML='<p class="error-message">Could not load JSON: '+error.message+'</p>'; }
    });

    // Week 6 + Week 9: Fetch XML and display the complete menu.
    document.getElementById('load-xml-button').addEventListener('click', async () => {
      output.innerHTML = '<p class="menu-status">Loading full XML menu...</p>';
      try {
        const response = await fetch('foodex-menu.xml');
        if (!response.ok) throw new Error('Network error: ' + response.status);
        const xml = new DOMParser().parseFromString(await response.text(), 'application/xml');
        if (xml.querySelector('parsererror')) throw new Error('Invalid XML document');
        const items = [...xml.getElementsByTagName('item')];
        const get = (item, tag) => item.getElementsByTagName(tag)[0]?.textContent || '';
        output.innerHTML = '<div class="data-heading"><div><p class="eyebrow">XML RESPONSE</p><h2>Complete FoodEX menu</h2></div><span>'+items.length+' items</span></div><div class="menu-grid">'+
          items.map(item => `<article class="menu-card"><img class="menu-item-image" src="${get(item,'image')}" alt="${get(item,'name')}"><div class="menu-card-body"><p class="eyebrow">${get(item,'category')}</p><h3>${get(item,'name')}</h3><p>${get(item,'restaurant')}</p><strong>₹${get(item,'price')}</strong></div></article>`).join('')+'</div>';
      } catch(error) { output.innerHTML='<p class="error-message">Could not load XML: '+error.message+'</p>'; }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
