<section class="page-header"><div><p class="eyebrow">WEEK 13</p><h1>Angular Cart</h1><p>The cart is shared across routes through CartService.</p></div><a class="button secondary" routerLink="/foods">Browse Food</a></section><section class="cart-card" *ngIf="cart$ | async as cart"><div *ngIf="cart.length; else emptyCart"><article class="cart-row" *ngFor="let food of cart;let i=index"><div><strong>{{food.name}}</strong><span>{{food.restaurant}}</span></div><strong>₹{{food.price}}</strong><button class="text-button" type="button" (click)="remove(i)">Remove</button></article><div class="cart-footer"><strong>Total: ₹{{total(cart.map(food => food.price))}}</strong><button class="button primary" type="button" (click)="clear()">Clear Cart</button></div></div><ng-template #emptyCart><div class="empty"><h2>Cart is empty</h2><p>Add a food item from the catalogue.</p></div></ng-template></section>
