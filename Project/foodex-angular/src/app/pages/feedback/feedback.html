<section class="form-card"><p class="eyebrow">WEEK 14</p><h1>FoodEX Feedback</h1><p>Reactive form validation with a routed Angular page.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><label for="name">Name</label><input id="name" formControlName="name"><small *ngIf="submitted && form.controls.name.invalid">Name is required.</small><label for="message">Feedback</label><textarea id="message" rows="5" formControlName="message"></textarea><small *ngIf="submitted && form.controls.message.invalid">Feedback must contain at least 5 characters.</small><button class="button primary" type="submit">Submit Feedback</button><p class="success" *ngIf="submitted && form.valid">Feedback submitted for this exercise.</p></form></section>
