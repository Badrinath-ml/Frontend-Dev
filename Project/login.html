<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FoodEX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <!-- Week 1: Static login page. -->
  <header class="site-header">
    <a class="brand" href="home.html"><span>Food</span>EX</a>
    <nav>
      <a href="home.html">Home</a>
      <a href="home.html#restaurants">Restaurants</a>
      <a href="cart.html" class="cart-link">Cart (0)</a>
      <a class="active" href="login.html">Login</a>
      <a class="nav-cta" href="register.html">Register</a>
    </nav>
  </header>

  <main class="form-page">
    <div class="form-card">
      <p class="eyebrow">WEEK 1</p>
      <h1>Welcome back</h1>
      <p class="muted">Login page for the FoodEX website.</p>
      <form action="home.html" method="get">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="alex@gmail.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <label class="checkbox-row">
          <input type="checkbox" id="remember_me">
          <span>Remember me</span>
        </label>

        <button class="button primary full-width" type="submit">Login</button>
      </form>
      <p class="form-footer">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
