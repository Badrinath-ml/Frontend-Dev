<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="auth-page login-page">
    <header class="site-header">
      <h1 class="fedex-logo">
        <span class="food">Food</span><span class="ex">Ex</span>
      </h1>
      <nav>
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="#">Search</a></li>
          <li><a href="#">Offers</a></li>
          <li><a href="#">Cart</a></li>
          <li id="login"><a href="login.html">Login</a></li>
          <li id="register"><a href="register.html">Register</a></li>
          <li id="order-now"><a href="home.html">Order Now</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Welcome Back</h2>
      <form action="home.html" method="post">
        
        <div class="input_field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="alex@gmail.com" required>
        </div>

        <div class="input_field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="........." required>
        </div>

        <div class="check_box">
          <input type="checkbox" id="remember_me">
          <label for="remember_me">Remember me</label>
        </div>
        <button type="submit">Login</button>
        <p class="form_footer">Don't have an account? <a href="register.html">Register</a></p>
      </form>

    </main>
  </body>
</html>
