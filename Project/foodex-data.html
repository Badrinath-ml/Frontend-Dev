<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodEx Menu Data</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="fedex-logo"><span class="food">Food</span><span class="ex">Ex</span></h1>
    <nav><ul><li><a href="home.html">Home</a></li><li><a href="foodex-notes.html">About</a></li><li><a href="register.html">Register</a></li><li><a href="cart.html" id="cart-link">cart(0)</a></li></ul></nav>
  </header>
  <main>
    <h2>FoodEx Data</h2>
    <button class="order-btn" type="button" id="load-xml-button">Load Menu (XML)</button>
    <button class="order-btn" type="button" id="load-json-button">Load Restaurants (JSON)</button>
    <div id="output" class="menu-grid" style="margin-top: 20px;"></div>
  </main>

  <script>
    const output = document.getElementById('output');

    document.getElementById('load-json-button').addEventListener('click', async () => {
      try {
        const response = await fetch('foodex-menu.json');
        if (!response.ok) throw new Error('Network error: ' + response.status);
        const items = await response.json();
        output.innerHTML = '<h3>Restaurants from JSON</h3>' + items.map((restaurant) =>
          `<article class="menu-card"><h4>${restaurant.name}</h4><p>${restaurant.cuisine}</p><strong>⭐ ${restaurant.rating}</strong></article>`
        ).join('');
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    });

    document.getElementById('load-xml-button').addEventListener('click', async () => {
      try {
        const response = await fetch('foodex-menu.xml');
        if (!response.ok) throw new Error('Network error: ' + response.status);
        const xml = new DOMParser().parseFromString(await response.text(), 'application/xml');
        if (xml.querySelector('parsererror')) throw new Error('Invalid XML document');

        const items = [...xml.getElementsByTagName('item')];
        output.innerHTML = '<h3>Menu from XML</h3>' + items.map((item) => {
          const name = item.getElementsByTagName('name')[0].textContent;
          const category = item.getElementsByTagName('category')[0].textContent;
          const price = item.getElementsByTagName('price')[0].textContent;
          return `<article class="menu-card"><h4>${name}</h4><p>${category}</p><strong>₹${price}</strong></article>`;
        }).join('');
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
