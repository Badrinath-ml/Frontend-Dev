<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodEx Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="fedex-logo"><span class="food">Food</span><span class="ex">Ex</span></h1>
    <nav><ul><li><a href="home.html">Home</a></li><li><a href="foodex-data.html">Menu Data</a></li><li><a href="register.html">Register</a></li><li><a href="cart.html" id="cart-link">cart(0)</a></li></ul></nav>
  </header>
  <main>
    <h2>FoodEx Feedback</h2>
    <form id="feedback-form" style="display: grid; gap: 12px; max-width: 480px;">
      <label for="name">Name:</label>
      <input type="text" id="name" required>
    <br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <label for="message">Feedback:</label>
      <textarea id="message" rows="4" required></textarea>
    <br><br>
    <button class="order-btn" type="submit">Send Feedback</button>
    </form>
    <pre id="output"></pre>
  </main>

  <script>
    document.getElementById('feedback-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const output = document.getElementById('output');
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error('Network error: ' + response.status);
        const data = await response.json();
        output.textContent = 'Server Response:\n' + JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
