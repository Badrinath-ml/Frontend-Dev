<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f5f7fb; color: #333; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <main style="width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box;">
      <form action="home.html" method="post" style="background: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px;">
        
        <div class="input_field" style="display: flex; flex-direction: column; gap: 6px;">
          <label for="email" style="font-size: 0.95rem; font-weight: 600;">Email</label>
          <input type="email" id="email" placeholder="alex@gmail.com" required style="padding: 12px 14px; border: 1px solid #ccd6e0; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s ease;">
        </div>

        <div class="input_field" style="display: flex; flex-direction: column; gap: 6px;">
          <label for="password" style="font-size: 0.95rem; font-weight: 600;">Password</label>
          <input type="password" id="password" placeholder="........." required style="padding: 12px 14px; border: 1px solid #ccd6e0; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s ease;">
        </div>

        <div class="check_box" style="display: flex; align-items: center; gap: 8px; font-size: 0.95rem;">
          <input type="checkbox" id="remember_me" style="width: 16px; height: 16px;">
          <label for="remember_me" style="margin: 0;">Remember me</label>
        </div>
        <button type="submit" style="padding: 14px 16px; border: none; border-radius: 8px; background: #ed5b2f; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s ease;">Sign In</button>
        <p class="form_footer" style="margin: 0; font-size: 0.95rem; text-align: center; color: #555;">Don't you have account <a href="register.html" style="color: #2f80ed; text-decoration: none;">Sign Up</a></p>
      </form>

    </main>
  </body>
</html>
