<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | FoodEX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Week 5: Cart uses localStorage so the project works without a backend. -->
  <header class="site-header">
    <a class="brand" href="home.html"><span>Food</span>EX</a>
    <nav>
      <a href="home.html">Home</a>
      <a href="home.html#restaurants">Restaurants</a>
      <a href="foodex-data.html">FoodEX Data</a>
      <a href="foodex-feedback.html">Feedback</a>
      <a class="active cart-link" href="cart.html">Cart (0)</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <p class="eyebrow">YOUR ORDER</p>
      <h1>FoodEX Cart</h1>
      <p>Review the items you selected from our restaurants.</p>
    </section>

    <section class="cart-layout">
      <div class="data-card">
        <div id="cart-items" class="cart-items"></div>
        <p id="empty-cart" class="menu-status">Your cart is empty.</p>
      </div>

      <aside class="summary-card">
        <h2>Order Summary</h2>
        <div class="summary-line"><span>Items</span><strong id="cart-count">0</strong></div>
        <div class="summary-line"><span>Subtotal</span><strong id="cart-subtotal">₹0</strong></div>
        <div class="summary-line"><span>Delivery</span><strong>₹0</strong></div>
        <div class="summary-total"><span>Total</span><strong id="cart-total-price">₹0</strong></div>
        <button id="place-order" class="button primary full-width" type="button">Place Order</button>
        <a href="home.html#restaurants" class="button secondary full-width">Add More Food</a>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
