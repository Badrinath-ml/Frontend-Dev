<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | FoodEX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <!-- Week 2: Student registration form using HTML form controls. -->
  <!-- Week 3: Common external CSS is used for the page styling. -->
  <!-- Week 4: register.js validates the registration fields with JavaScript. -->
  <header class="site-header">
    <a class="brand" href="home.html"><span>Food</span>EX</a>
    <nav>
      <a href="home.html">Home</a>
      <a href="home.html#restaurants">Restaurants</a>
      <a href="foodex-data.html">FoodEX Data</a>
      <a href="cart.html" class="cart-link">Cart (0)</a>
      <a href="login.html">Login</a>
      <a class="active nav-cta" href="register.html">Register</a>
    </nav>
  </header>

  <main class="form-page">
    <div class="form-card">
      <p class="eyebrow">WEEK 2 + WEEK 4</p>
      <h1>Create your account</h1>
      <p class="muted">Enter your details and JavaScript will check the fields.</p>

      <form id="registerForm" novalidate>
        <div class="two-column">
          <div>
            <label for="f_name">First name</label>
            <input type="text" id="f_name" placeholder="Alex">
            <span class="error" id="f_name_error"></span>
          </div>
          <div>
            <label for="l_name">Last name</label>
            <input type="text" id="l_name" placeholder="Johnson">
            <span class="error" id="l_name_error"></span>
          </div>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="alex@gmail.com">
        <span class="error" id="email_error"></span>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">
        <span class="error" id="password_error"></span>

        <label for="location">Location</label>
        <input type="text" id="location" placeholder="Hyderabad">
        <span class="error" id="location_error"></span>

        <label class="checkbox-row">
          <input type="checkbox" id="terms">
          <span>I agree to the basic terms.</span>
        </label>
        <span class="error" id="terms_error"></span>

        <button class="button primary full-width" type="submit">Register</button>
        <p id="register-message" class="success-message"></p>
      </form>
    </div>
  </main>
  <script src="register.js"></script>
  <script src="script.js"></script>
</body>
</html>
