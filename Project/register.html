<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register Page</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="auth-page register-page">
    <header class="site-header">
      <h1 class="fedex-logo">
        <span class="food">Food</span><span class="ex">Ex</span>
      </h1>
      <nav>
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="#">Search</a></li>
          <li><a href="#">Offers</a></li>
          <li><a href="#">Cart</a></li>
          <li id="login"><a href="login.html">Login</a></li>
          <li id="register"><a href="register.html">Register</a></li>
          <li id="order-now"><a href="home.html">Order Now</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h2>Create Your Account</h2>
      <form id="registerForm">
        <div class="input_field">
          <label for="f_name">First name</label>
          <input type="text" id="f_name" placeholder="alex" required>
          <span class="error" id="f_name_error"></span>
        </div>
        <div class="input_field">
          <label for="l_name">Last name</label>
          <input type="text" id="l_name" placeholder="jhon" required>
          <span class="error" id="l_name_error"></span>
        </div>
        <div class="input_field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="alex@gmail.com" required>
          <span class="error" id="email_error"></span>
        </div>

        <div class="input_field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="........." required>
          <span class="error" id="password_error"></span>
        </div>
        <!-- Location -->
        <div class="input_field">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="Enter your location" required>
          <span class="error" id="location_error"></span>
        </div>

        <div class="check_box">
          <input type="checkbox">
          <label for="remember_me">Remember me</label>
        </div>
        <button type="submit">Register</button>
      </form>

    </main>
    <script src="register.js"></script>
  </body>
</html>
