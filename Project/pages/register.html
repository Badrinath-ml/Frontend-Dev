<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | FoodEX</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="auth-page"><header class="site-header auth-header"><a class="brand" href="../index.html"><span>Food</span>EX</a></header>
<main class="form-page"><div class="form-card"><p class="eyebrow">GET STARTED</p><h1>Create your FoodEX account</h1><p class="muted">Register first, then continue to the login page.</p><form id="registerForm" novalidate><div class="two-column"><div><label for="f_name">First name</label><input type="text" id="f_name" placeholder="Alex"><span class="error" id="f_name_error"></span></div><div><label for="l_name">Last name</label><input type="text" id="l_name" placeholder="Johnson"><span class="error" id="l_name_error"></span></div></div><label for="email">Email</label><input type="email" id="email" placeholder="alex@gmail.com"><span class="error" id="email_error"></span><label for="password">Password</label><input type="password" id="password" placeholder="Minimum 6 characters"><span class="error" id="password_error"></span><label for="location">Location</label><input type="text" id="location" placeholder="Hyderabad"><span class="error" id="location_error"></span><label class="checkbox-row"><input type="checkbox" id="terms"><span>I agree to the basic terms.</span></label><span class="error" id="terms_error"></span><button class="button primary full-width" type="submit">Register</button><p id="register-message" class="success-message"></p></form><p class="form-footer">Already registered? <a href="login.html">Login</a></p></div></main><script src="../js/register.js"></script></body></html>
