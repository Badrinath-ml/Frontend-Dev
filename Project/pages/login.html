<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | FoodEX</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="auth-page"><header class="site-header auth-header"><a class="brand" href="../index.html"><span>Food</span>EX</a></header>
<main class="form-page"><div class="form-card"><p class="eyebrow">WELCOME BACK</p><h1>Login to FoodEX</h1><p class="muted" id="login-status">Use the account you registered with.</p><form id="loginForm"><label for="email">Email</label><input type="email" id="email" placeholder="alex@gmail.com" required><label for="password">Password</label><input type="password" id="password" placeholder="Enter password" required><label class="checkbox-row"><input type="checkbox" id="remember_me"><span>Remember me</span></label><button class="button primary full-width" type="submit">Login</button><p id="login-message" class="error"></p></form><p class="form-footer">Don't have an account? <a href="register.html">Register</a></p></div></main>
<script>const params=new URLSearchParams(location.search);if(params.get("registered")==="1")document.getElementById("login-status").textContent="Registration successful. Login with your new account.";document.getElementById("loginForm").addEventListener("submit",(e)=>{e.preventDefault();const saved=JSON.parse(localStorage.getItem("foodexUser")||"null"),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,msg=document.getElementById("login-message");if(!saved){msg.textContent="No registered account found. Please register first.";return;}if(email!==saved.email||password!==saved.password){msg.textContent="Invalid email or password.";return;}sessionStorage.setItem("foodexLoggedIn","true");location.href="../home.html";});</script></body></html>
