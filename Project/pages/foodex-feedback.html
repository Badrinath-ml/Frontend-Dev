<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback | FoodEX</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- Week 10: Send feedback data using Fetch API and POST method. -->
    <header class="site-header">
      <a class="brand" href="../home.html"><span>Food</span>EX</a>
      <nav class="main-nav"></nav>
    </header>
    <main class="form-page">
      <div class="form-card">
        <p class="eyebrow">FOODEX FEEDBACK</p>
        <h1>Send feedback</h1>
        <p class="muted">
          This form demonstrates a POST request with Fetch API.
        </p>
        <form id="feedback-form">
          <label for="name">Name</label
          ><input type="text" id="name" required /><label for="email"
            >Email</label
          ><input type="email" id="email" required /><label for="message"
            >Feedback</label
          ><textarea id="message" rows="5" required></textarea
          ><button class="button primary full-width" type="submit">
            Send Feedback
          </button>
        </form>
        <pre id="output" class="text-output">No request sent yet.</pre>
      </div>
    </main>
    <script>
      document
        .getElementById("feedback-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const output = document.getElementById("output");
          const payload = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value,
          };
          try {
            const response = await fetch(
              "https://jsonplaceholder.typicode.com/posts",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              },
            );
            if (!response.ok)
              throw new Error("Network error: " + response.status);
            const data = await response.json();
            output.textContent =
              "Server Response:\n" + JSON.stringify(data, null, 2);
          } catch (error) {
            output.textContent = "Error: " + error.message;
          }
        });
    </script>
    <script src="../js/script.js"></script>
  </body>
</html>
