<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu | FoodEX</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../home.html"><span>Food</span>EX</a>
      <nav class="main-nav"></nav>
    </header>
    <main>
      <div class="breadcrumb">
        <a href="../home.html">Home</a><span>/</span
        ><a href="../home.html#restaurants">Restaurants</a><span>/</span>Menu
      </div>
      <section class="restaurant-banner">
        <img id="restaurant-image" class="restaurant-banner-image" alt="" />
        <div>
          <p class="eyebrow">FOODEX RESTAURANT</p>
          <h1 id="restaurant-name">Restaurant Menu</h1>
          <p id="restaurant-details" class="muted">
            Loading restaurant details...
          </p>
          <a class="button secondary" href="../home.html#restaurants"
            >← Back to restaurants</a
          >
        </div>
      </section>
      <section class="section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">COMPLETE MENU</p>
            <h2>Choose what you want</h2>
          </div>
          <span id="menu-count" class="result-count"></span>
        </div>
        <div class="menu-grid" id="restaurant-menu-items">
          <p class="menu-status">Loading menu...</p>
        </div>
      </section>
    </main>
    <script src="../js/script.js"></script>
  </body>
</html>
