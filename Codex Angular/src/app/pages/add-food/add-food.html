<section class="form-card"><p class="eyebrow">WEEK 14</p><h1>Add a Food Item</h1><p>Create a new FoodEX item using Angular Reactive Forms.</p><form [formGroup]="foodForm" (ngSubmit)="submit()" novalidate><label for="name">Food name</label><input id="name" formControlName="name"><small *ngIf="submitted && foodForm.controls.name.invalid">Name is required and must contain at least 2 characters.</small><label for="restaurant">Restaurant</label><input id="restaurant" formControlName="restaurant"><small *ngIf="submitted && foodForm.controls.restaurant.invalid">Restaurant is required.</small><label for="category">Category</label><input id="category" formControlName="category"><small *ngIf="submitted && foodForm.controls.category.invalid">Category is required.</small><label for="price">Price</label><input id="price" type="number" min="1" formControlName="price"><small *ngIf="submitted && foodForm.controls.price.invalid">Price must be at least ₹1.</small><div class="form-actions"><a class="button secondary" routerLink="/foods">Cancel</a><button class="button primary" type="submit">Add Food</button></div></form></section>
