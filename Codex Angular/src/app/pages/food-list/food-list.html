<section class="page-header"><div><p class="eyebrow">WEEK 11-13</p><h1>FoodEX Angular Catalogue</h1><p>TypeScript models, Angular components, directives and shared services.</p></div><a class="button secondary" routerLink="/add-food">Add Food</a></section>
<div class="toolbar"><label for="search">Search food</label><input id="search" type="search" [(ngModel)]="searchText" placeholder="Biryani, Pizza, Burger..."></div>
<section class="food-grid" *ngIf="foods$ | async as foods"><article class="food-card" *ngFor="let food of filteredFoods(foods)"><div><p class="eyebrow">{{food.category}}</p><h2>{{food.name}}</h2><p>{{food.restaurant}}</p><strong>₹{{food.price}}</strong></div><div class="card-actions"><button class="button primary" type="button" (click)="addToCart(food)">Add to Cart</button><button class="text-button" type="button" (click)="removeFood(food.id)">Remove</button></div></article><p class="empty" *ngIf="filteredFoods(foods).length===0">No food matched your search.</p></section>
